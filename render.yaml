# Render Blueprint for the Gen AI Job Assistant.
# Deploys the Express backend (web service) and the Vite frontend (static site).
# MongoDB is hosted separately on MongoDB Atlas; set MONGO_URI in the dashboard.
#
# After importing this blueprint in Render, you still must fill in the secret
# env vars marked `sync: false` (MONGO_URI, JWT_SECRET, GOOGLE_GENAI_API_KEY)
# and set the two cross-reference URLs (FRONTEND_URL / VITE_API_URL) once both
# services have their URLs.

services:
  # ---------- Backend: Express API ----------
  - type: web
    name: gen-ai-job-assistant-api
    runtime: node
    rootDir: Backend
    plan: free
    # Install deps and download the Chromium that Puppeteer needs, into a
    # project-local cache so it persists from build to runtime.
    buildCommand: npm install && npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Puppeteer's Chromium cache location is pinned in Backend/.puppeteerrc.cjs
      # to a project-local path, so no PUPPETEER_CACHE_DIR env var is needed.
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_GENAI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ---------- Frontend: Vite static site ----------
  - type: web
    name: gen-ai-job-assistant-web
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA routing: send all paths to index.html so React Router works.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
